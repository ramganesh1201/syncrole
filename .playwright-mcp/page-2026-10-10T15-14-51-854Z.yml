              - generic [ref=f3e361]:
                - generic [ref=f3e362]:
                  - generic [ref=f3e363]: 01 • Mode & Duration
                  - generic [ref=f3e364]: Computer Based Test (CBT)
                  - paragraph [ref=f3e365]: Conducted online at designated test centers across India. Total duration is 3 Hours (180 minutes) in English medium.
                - generic [ref=f3e366]:
                  - generic [ref=f3e367]: 02 • Weightage Breakdown
                  - generic [ref=f3e368]: 65 Questions • 100 Marks
                  - paragraph [ref=f3e369]: "General Aptitude (GA): 15% (15 Marks, 10 Questions). Core Subject Discipline: 85% (85 Marks, 55 Questions)."
                - generic [ref=f3e370]:
                  - generic [ref=f3e371]: 03 • Question Types
                  - generic [ref=f3e372]: MCQ • MSQ • NAT
                  - paragraph [ref=f3e373]: Multiple Choice (MCQ), Multiple Select (MSQ), and Numerical Answer Type (NAT) questions.
              - generic [ref=f3e374]:
                - generic [ref=f3e375]: Question Format & Negative Marking Rules
                - generic [ref=f3e376]:
                  - generic [ref=f3e377]:
                    - generic [ref=f3e378]: MCQ (Multiple Choice)
                    - generic [ref=f3e379]: 4 options provided with exactly 1 correct answer.
                    - generic [ref=f3e380]: "Negative Marking: 1/3 mark deducted for 1-mark Q; 2/3 mark deducted for 2-mark Q."
                  - generic [ref=f3e381]:
                    - generic [ref=f3e382]: MSQ (Multiple Select)
                    - generic [ref=f3e383]: One or more correct options out of 4 options provided.
                    - generic [ref=f3e384]: Zero Negative Marking. No partial credit for incomplete selection.
                  - generic [ref=f3e385]:
                    - generic [ref=f3e386]: NAT (Numerical Answer Type)
                    - generic [ref=f3e387]: Numerical value entered using on-screen virtual keyboard.
                    - generic [ref=f3e388]: Zero Negative Marking. Entered value must lie within official tolerance range.
